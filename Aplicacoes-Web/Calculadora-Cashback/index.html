<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Cashback</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; background: #0f172a; color: #fff; }
    .container { width: min(100%, 520px); background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    h1, h2 { text-align: center; }
    label { display: block; margin-top: 14px; color: #cbd5e1; font-size: .9rem; }
    input, select, button { width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 9px; font: inherit; }
    button { margin-top: 18px; background: #22c55e; color: #fff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #resultado { min-height: 28px; margin-top: 18px; text-align: center; color: #38bdf8; }
    #erro { min-height: 20px; color: #fca5a5; text-align: center; }
    ul { list-style: none; padding: 0; }
    li { margin-top: 8px; padding: 10px; border-radius: 8px; background: #334155; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Calculadora de Cashback</h1>
    <form id="cashback-form">
      <label for="tipo">Tipo de cliente</label>
      <select id="tipo">
        <option value="normal">Normal</option>
        <option value="vip">VIP</option>
      </select>

      <label for="valor">Valor da compra</label>
      <input type="number" id="valor" min="0.01" step="0.01" required>

      <label for="cupom">Cupom (%)</label>
      <input type="number" id="cupom" min="0" max="100" step="0.01" value="0" required>

      <button id="btn" type="submit">Calcular cashback</button>
    </form>

    <p id="resultado"></p>
    <p id="erro"></p>

    <h2>Histórico</h2>
    <ul id="historico"></ul>
  </main>

  <script>
    const API_URL = "https://calculadora-cashback-csom.onrender.com";
    const form = document.getElementById("cashback-form");
    const botao = document.getElementById("btn");
    const resultado = document.getElementById("resultado");
    const erro = document.getElementById("erro");

    async function lerJson(response) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || "Não foi possível concluir a operação");
      return data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      erro.textContent = "";
      resultado.textContent = "";
      botao.disabled = true;
      botao.textContent = "Calculando...";

      const valorCompra = Number(document.getElementById("valor").value);
      const cupom = Number(document.getElementById("cupom").value);
      const tipoCliente = document.getElementById("tipo").value;

      try {
        const response = await fetch(`${API_URL}/calcular-cashback`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tipo_cliente: tipoCliente, valor_compra: valorCompra, cupom })
        });
        const data = await lerJson(response);
        const precoFinal = valorCompra * (1 - cupom / 100);
        resultado.textContent = `Valor final: R$ ${precoFinal.toFixed(2)} | Cashback: R$ ${data.cashback.toFixed(2)}`;
        await carregarHistorico();
      } catch (error) {
        erro.textContent = error.message;
      } finally {
        botao.disabled = false;
        botao.textContent = "Calcular cashback";
      }
    });

    async function carregarHistorico() {
      const lista = document.getElementById("historico");
      try {
        const data = await lerJson(await fetch(`${API_URL}/historico`));
        lista.innerHTML = "";
        data.historico.forEach((item) => {
          const li = document.createElement("li");
          li.textContent = `${item.tipo_cliente.toUpperCase()} - R$ ${item.valor_compra.toFixed(2)} → Cashback: R$ ${item.valor_cashback.toFixed(2)}`;
          lista.appendChild(li);
        });
      } catch (error) {
        lista.innerHTML = `<li>${error.message}</li>`;
      }
    }

    carregarHistorico();
  </script>
</body>
</html>
