<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calcule cashback para clientes Normal e VIP com aplicação de cupons.">
  <title>Calculadora de Cashback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="cashback-card" aria-labelledby="page-title">
      <header class="card-header">
        <div class="brand-icon" aria-hidden="true">%</div>
        <div>
          <h1 id="page-title">Calculadora de Cashback</h1>
          <p class="subtitle">Simule descontos, benefícios e consulte os cálculos recentes.</p>
        </div>
      </header>

      <form id="cashback-form" class="form-grid">
        <div class="form-field">
          <label for="tipo">Tipo de cliente</label>
          <select id="tipo" name="tipo_cliente">
            <option value="normal">Normal</option>
            <option value="vip">VIP</option>
          </select>
        </div>

        <div class="form-field">
          <label for="cupom">Cupom de desconto (%)</label>
          <input type="number" id="cupom" name="cupom" min="0" max="100" step="0.01" value="0" required>
        </div>

        <div class="form-field full">
          <label for="valor">Valor da compra</label>
          <input type="number" id="valor" name="valor_compra" min="0.01" max="10000000" step="0.01" placeholder="Ex.: 750,00" required>
        </div>

        <button id="submit-button" class="submit-button" type="submit">Calcular cashback</button>
      </form>

      <p id="result" class="feedback result" aria-live="polite"></p>
      <p id="error-message" class="feedback error" role="alert"></p>

      <section class="history-section" aria-labelledby="history-title">
        <div class="history-header">
          <h2 id="history-title">Histórico recente</h2>
          <span id="history-status" class="history-status">Carregando...</span>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </section>
    </section>
  </main>
</body>
</html>
