<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="weather-app">
        <div class="Weather-container">

            <section class="weather-card">
                <div class="weather-header">
                    <div class="weather-icon">☀️</div>
                    <div>
                        <h1>Configuração do Clima</h1>
                        <p class="subtitle">Escolha a cidade para sua previsão detalhada</p>
                    </div>
                </div>

                <form id="weather-form" method="post">
                    <label for="cidade">Cidade</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="São Paulo"
                        required
                        autocomplete="off"
                        minlength="2"
                        maxlength="50"
                    >
                    <button type="submit" id="submit-btn">
                        <span class="search-icon">🔍</span> Obter Previsão Completa
                    </button>
                </form>

                <div id="loader" class="loader" style="display: none;">
                    <div class="spinner"></div>
                    <p>Buscando previsão...</p>
                </div>

                <div id="error-message" class="error-message" style="display: none;">
                    <span id="error-text"></span>
                </div>

                <footer class="weather-footer">
                    <p>Abaixo, explore os detalhes passo a passo.</p>
                    <p class="highlight-footer">Rápido, detalhado e intuitivo.</p>
                </footer>
            </section>

            <section class="forecast-panel" id="forecast-panel" style="display: none;">
                <div class="cabecalho">
                    <h2>
                        Detalhes do Clima:
                        <span id="city-title-header">---</span>
                    </h2>

                    <button id="botao-reset" class="botao-reset">
                         ↻
                    </button>
                </div>

                <div class="forecast-card">
                    <button id="prev-btn" class="nav-btn">‹</button>

                    <div id="card-content">
                        <h3 id="card-title">Aguardando busca</h3>
                        <p id="card-value">Digite uma cidade</p>
                    </div>

                    <button id="next-btn" class="nav-btn">›</button>
                </div>

                <div class="weather-options-bar">
                    <button class="option-btn" data-index="0">
                        <span class="option-icon">🌍</span>
                        <span class="option-label">Cidade</span>
                    </button>
                    <button class="option-btn" data-index="1">
                        <span class="option-icon">🌡️</span>
                        <span class="option-label">Temp</span>
                    </button>
                    <button class="option-btn" data-index="2">
                        <span class="option-icon">☁️</span>
                        <span class="option-label">Descrição</span>
                    </button>
                    <button class="option-btn" data-index="3">
                        <span class="option-icon">💧</span>
                        <span class="option-label">Umidade</span>
                    </button>
                    <button class="option-btn" data-index="4">
                        <span class="option-icon">🤗</span>
                        <span class="option-label">Sensação</span>
                    </button>
                    <button class="option-btn" data-index="5">
                        <span class="option-icon">💨</span>
                        <span class="option-label">Vento</span>
                    </button>
                    <button class="option-btn" data-index="6">
                        <span class="option-icon">📈</span>
                        <span class="option-label">Pressão</span>
                    </button>
                </div>

                <div id="pagination" class="pagination"></div>

                <div class="ver-tudo-container">
                    <button class="ver-tudo-btn">Ver Tudo</button>
                </div>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
